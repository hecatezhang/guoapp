name: Build Windows (cloud)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian        # 红果鉴：仅红果站源
            all_sources: 'false'
          - edition: zhenguojian        # 真果鉴：全部站源
            all_sources: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
          cache-dependency-path: native/go.sum

      - name: Install MinGW-w64
        shell: pwsh
        run: |
          choco install mingw -y
          $mingwPath = "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin"
          if (Test-Path $mingwPath) {
            Add-Content -Path $env:GITHUB_PATH -Value $mingwPath
            Write-Host "Added $mingwPath to PATH"
          }

      - name: Verify MinGW
        shell: pwsh
        run: |
          x86_64-w64-mingw32-gcc --version
          Get-Command x86_64-w64-mingw32-gcc

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows
        run: python scripts/build_windows.py --all-sources=${{ matrix.all_sources }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-windows-x64
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14
